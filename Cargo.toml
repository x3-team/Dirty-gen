[package]
name = "silt"
version = "0.1.0"
edition = "2021"
description = "Silt — real-time mud and off-road terramechanics"
license = "MIT"

[lib]
name = "silt"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.29", features = ["bytemuck"] }
png = "0.17"
pollster = "0.4"
serde_json = "1"
wgpu = "23"
winit = "0.30"

# Browser build (`trunk serve --release`). Native builds ignore these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlCanvasElement", "Location", "Window"] }
web-time = "1"
wgpu = { version = "23", features = ["webgl"] }
