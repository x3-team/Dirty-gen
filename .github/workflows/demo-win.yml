name: demo-win

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or tag to build
        required: false
        default: main
permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Build release
        run: cargo build --release

      - name: Smoke launch
        shell: pwsh
        run: |
          .\target\release\silt.exe --win-demo-smoke
          if ($LASTEXITCODE -ne 0) {
            Write-Error "win-demo-smoke failed with code $LASTEXITCODE"
            exit 1
          }
          Write-Host "smoke ok"

      - name: Resolve checked-out commit
        id: head
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "HEAD=$sha (git_ref=${{ inputs.git_ref }})"

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item target\release\silt.exe pkg\
          @"
          Silt — Niva Windows demo

          Run: silt.exe --win-demo
          WASD drive, R reset, mouse orbit, wheel zoom.
          CI smoke: silt.exe --win-demo-smoke
          "@ | Set-Content -Encoding utf8 pkg\README.txt
          Compress-Archive -Path pkg\* -DestinationPath silt-win-demo.zip -Force

      - name: Publish GitHub Release
        env:
          TAG: demo-win-${{ github.run_number }}-${{ steps.head.outputs.sha }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ steps.head.outputs.sha }}
          name: Windows Niva demo ${{ github.run_number }}
          body: |
            Playable Windows build from workflow run ${{ github.run_number }}.
            Built from ref `${{ inputs.git_ref }}` at `${{ steps.head.outputs.sha }}`.
            Launch with `silt.exe --win-demo`.
            WASD drive, R reset, mouse orbit, wheel zoom.
          files: silt-win-demo.zip
          make_latest: false
