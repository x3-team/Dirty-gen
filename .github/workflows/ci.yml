name: ci

# One run per pull request update. A push of the same commit does not
# start a second copy, and a merge to main does not run this workflow.
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Niva creek crossing
        run: |
          # rustc links meshopt with lld, which does not search gcc's lib dir
          # when cc is clang. Point it at libstdc++ wherever g++ keeps it.
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test creek -- --nocapture
      - name: Niva puddle rut
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test puddle_rut -- --nocapture
      - name: Niva acceptance through-drive
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test e2e_niva -- --nocapture
      - name: Windows demo playground
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test win_demo -- --nocapture
      - name: Release solver budget
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          unset DISPLAY
          cargo test --release --test e2e_niva --test frame_bench --test fog_air -- --nocapture

  win-demo-zip:
    needs: test
    if: success()
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Build release
        run: cargo build --release
      - name: Smoke launch
        shell: pwsh
        run: |
          .\target\release\silt.exe --win-demo-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item target\release\silt.exe pkg\
          Compress-Archive -Path pkg\* -DestinationPath silt-win-demo.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: silt-win-demo
          path: silt-win-demo.zip
      - name: Tag demo-win at build SHA
        env:
          TAG: demo-win-${{ github.run_number }}-${{ github.sha }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f "$TAG" "${{ github.sha }}"
          git push origin "refs/tags/$TAG" -f
