name: ci

# One run per pull request update. A push of the same commit does not
# start a second copy, and a merge to main does not run this workflow.
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Niva creek crossing
        run: |
          # rustc links meshopt with lld, which does not search gcc's lib dir
          # when cc is clang. Point it at libstdc++ wherever g++ keeps it.
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test creek -- --nocapture
      - name: Niva puddle rut
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test puddle_rut -- --nocapture
      - name: Niva acceptance through-drive
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test e2e_niva -- --nocapture
      - name: Release solver budget
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          unset DISPLAY
          cargo test --release --test e2e_niva --test frame_bench --test fog_air -- --nocapture

  # Static GPU budget (docs/GPU_BUDGET.md). No GPU on the runner: WGSL loop
  # bounds and WebGL2 translation run in a test; draw calls, triangles and
  # texture/buffer memory per quality preset are counted on lavapipe.
  # Triangles are reported but allowed until the CDLOD terrain (#120) lands.
  gpu-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Shader budget and WebGL2
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --release --test gpu_budget --lib quality -- --nocapture
      - name: Draw calls and memory per preset
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          unset DISPLAY
          cargo build --release
          GPU_BUDGET_ALLOW=triangles ./target/release/silt budget --software 2>&1 | grep -E "GPU_BUDGET|exceeded|panicked"
          exit ${PIPESTATUS[0]}
