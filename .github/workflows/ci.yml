name: ci

# Pull requests compare against the base commit. A push to main compares
# against github.event.before. workflow_dispatch with no parent runs the
# absolute caps only. A missing base sha is not itself a failure.
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Niva creek crossing
        run: |
          # rustc links meshopt with lld, which does not search gcc's lib dir
          # when cc is clang. Point it at libstdc++ wherever g++ keeps it.
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test creek -- --nocapture
      - name: Niva puddle rut
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test puddle_rut -- --nocapture
      - name: Niva acceptance through-drive
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test e2e_niva -- --nocapture
      - name: Release solver budget
        env:
          PERF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          unset DISPLAY
          python3 scripts/perf_ratio.py
