name: ci

# One run per pull request update. A push of the same commit does not
# start a second copy, and a merge to main does not run this workflow.
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Niva creek crossing
        run: |
          # rustc links meshopt with lld, which does not search gcc's lib dir
          # when cc is clang. Point it at libstdc++ wherever g++ keeps it.
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test creek -- --nocapture
      - name: Niva puddle rut
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test puddle_rut -- --nocapture
      - name: Niva acceptance through-drive
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test e2e_niva -- --nocapture
      - name: Release solver budget
        env:
          # f97aed4 passed the flat caps in run 41231677339. dfc05d4 is that
          # same tree and is not the pin: an exit 101 from the base is an error.
          PERF_BASE_SHA: f97aed4a6b628b626ba0371e08e582a5db413b4b
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          unset DISPLAY
          python3 scripts/perf_ratio.py
