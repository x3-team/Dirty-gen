name: ci

# One run per pull request update. A push of the same commit does not
# start a second copy, and a merge to main does not run this workflow.
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Niva creek crossing
        run: |
          # rustc links meshopt with lld, which does not search gcc's lib dir
          # when cc is clang. Point it at libstdc++ wherever g++ keeps it.
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test creek -- --nocapture
      - name: Niva puddle rut
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test puddle_rut -- --nocapture
      - name: Niva crust and cracks
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test crust_cracks -- --nocapture
      - name: Niva puddle shore
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          export RAYON_NUM_THREADS=1
          cargo test --test puddle_shore -- --test-threads=1 --nocapture
      - name: Niva acceptance through-drive
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test e2e_niva -- --nocapture --test-threads=1
      - name: Scripted drive
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --test scripted_drive -- --nocapture
      - name: Release solver budget
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          unset DISPLAY
          RAYON_NUM_THREADS=1 cargo test --release --test puddle_shore one_fine_substep_matches_eight -- --nocapture
          cargo test --release --test puddle_shore puddle_shore_follows_relief -- --nocapture
          cargo test --release --test e2e_niva --test frame_bench --test fog_air --test ford_beach --test ford_drive -- --nocapture
          cargo test --release --test scripted_drive --test turbidity -- --nocapture
          cargo test --release --test crust_cracks -- --nocapture
          cargo test --release --test puddle_rut -- --nocapture

  # Static GPU budget (docs/GPU_BUDGET.md). No GPU on the runner: WGSL loop
  # bounds and WebGL2 translation run in a test; draw calls, triangles and
  # texture/buffer memory per quality preset are counted on lavapipe.
  # Triangles are reported but allowed until the CDLOD terrain (#120) lands.
  gpu-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Shader budget and WebGL2
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          cargo test --release --test gpu_budget -- --nocapture
          cargo test --release --lib quality::
      - name: Draw calls and memory per preset
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          export CXX=g++ CC=gcc
          unset DISPLAY
          cargo build --release
          GPU_BUDGET_ALLOW=triangles ./target/release/silt budget --software 2>&1 | grep -E "GPU_BUDGET|exceeded|panicked"
          exit ${PIPESTATUS[0]}
