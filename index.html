<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silt</title>
    <link data-trunk rel="rust" data-bin="silt" data-wasm-opt="0" />
    <link data-trunk rel="css" href="ui/touch.css" />
    <link data-trunk rel="css" href="ui/start-menu.css" />
    <link data-trunk rel="copy-file" href="ui/start-menu.js" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a120c;
        color: #efe2d2;
        font: 15px/1.45 "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #silt {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: block;
        outline: none;
        touch-action: none;
        background: #24180f;
      }
      #hud {
        padding: 8px 14px 10px;
        background: #140e09;
      }
      #backend {
        opacity: 0.75;
      }
      #lap {
        position: fixed;
        z-index: 2;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        background: rgba(20, 14, 9, 0.86);
        color: #efe2d2;
        font: 600 15px/1.3 "Segoe UI", sans-serif;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="silt" tabindex="0"></canvas>
    </div>
    <div id="lap">Старт · 0 кругов · 0:00.0</div>
    <div id="hud">
      Старт отдаёт руль выбранной машине, вторая едет круг. Кликните по сцене. W / ↑ газ, S / ↓ тормоз, A / ← и D / → руль, V кого ведёте, C изометрия, погоня, кабина, L грязь на стекле.
      На экране телефона: руль слева, газ и тормоз справа.
      <span id="backend">загрузка…</span>
    </div>
    <script data-trunk src="ui/touch.js"></script>
    <div id="silt-menu-state" data-phase="menu" data-vehicle="buggy" data-action="" hidden></div>
    <script type="module" src="start-menu.js"></script>
    <script>
      const canvas = document.getElementById("silt");
      const focus = () => canvas.focus();
      window.addEventListener("load", focus);
      canvas.addEventListener("pointerdown", focus);
      window.addEventListener(
        "keydown",
        (event) => {
          if (event.target instanceof Element && event.target.closest("button")) {
            return;
          }
          if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight" ||
            event.key === " "
          ) {
            event.preventDefault();
          }
        },
        { passive: false }
      );
    </script>
  </body>
</html>
